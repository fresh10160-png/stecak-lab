[project]
name = "stecak-lab"
version = "0.1.0"
description = "Istraživački laboratorij za katalogizaciju i analizu stećaka"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "folium>=0.15",
]

[project.optional-dependencies]
dev = ["jupyter>=1.0", "ipykernel>=6.0", "pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stecak_lab"]
